# -----------------------------------------------------------------------------
# Repo-local Dremio overrides (this file is merged on top of dremio-reference.conf).
#
# DREMIO_CONF_DIR for this project (when using distribution bin/dremio):
#   <repository-root>/conf
# Example (bash):
#   export DREMIO_CONF_DIR="/absolute/path/to/thesis/conf"
#   export DREMIO_HOME="/opt/dremio"   # or your install root; paths below may use ${DREMIO_HOME}
#
# Dev server via Maven (classpath includes this directory automatically):
#   mvn compile exec:exec -pl dac/daemon
# -----------------------------------------------------------------------------

services: {
  coordinator: {
    web: {
      chatbot: {
        gateway: {
          # Dremio SQL Agent gateway (reverse-proxy target for UI /aichat/*).
          # Legacy alias services.coordinator.web.aichatbot.plugin.base_url
          # and env DREMIO_AICHATBOT_PLUGIN_BASE_URL are still accepted.
          base_url: "http://127.0.0.1:9292"
        }
      }
    }
  }
}
